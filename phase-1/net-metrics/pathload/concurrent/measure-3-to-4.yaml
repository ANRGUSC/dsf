apiVersion: v1
kind: Pod
metadata:
  name: pathload-receiver-3to4
  namespace: default
  labels:
    measurement: "3-to-4"
    role: receiver
spec:
  hostNetwork: true
  containers:
  - name: pathload-receiver
    image: mohammadalikh/pathload-receiver:concurrent
    imagePullPolicy: Always
    command: ["sh", "-c", "sleep 3 && for i in $(seq 1 10); do pathload_rcv -s 192.168.1.164 && break || sleep 2; done"]
    env:
    - name: UDPRCV_PORT
      value: "55001"
    - name: TCPSND_PORT
      value: "55002"
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  nodeSelector:
    kubernetes.io/hostname: anrg-4
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: pathload-sender-3to4
  namespace: default
  labels:
    measurement: "3-to-4"
    role: sender
spec:
  hostNetwork: true
  containers:
  - name: pathload-sender
    image: mohammadalikh/pathload-sender:concurrent
    imagePullPolicy: Always
    command: ["pathload_snd"]
    env:
    - name: UDPRCV_PORT
      value: "55001"
    - name: TCPSND_PORT
      value: "55002"
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  nodeSelector:
    kubernetes.io/hostname: anrg-3
  restartPolicy: Never
