apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pathload-orchestrator
  namespace: default
  labels:
    app: pathload-orchestrator
spec:
  selector:
    matchLabels:
      app: pathload-orchestrator
  template:
    metadata:
      labels:
        app: pathload-orchestrator
    spec:
      hostNetwork: true
      serviceAccountName: pathload-orchestrator
      containers:
      - name: orchestrator
        image: mohammadalikh/pathload-orchestrator:latest
        imagePullPolicy: Always
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/rancher/k3s
          readOnly: true
      volumes:
      - name: kubeconfig
        hostPath:
          path: /var/lib/rancher/k3s
          type: DirectoryOrCreate
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
