apiVersion: dsf.example.com/v1
kind: ContinuousTaskGraph
metadata:
  name: gpt2-ctg
  namespace: default
spec:
  zeromq:
    discovery:
      method: kubernetes
      namespace: default
      serviceNamePattern: '{task-name}-service'
    topicPrefix: gpt2-ctg
    defaultPort: 5555
    defaultTransport: tcp
    connectionTimeout: 5000
    reconnectInterval: 1000
    maxReconnectAttempts: 10
  scheduler:
    name: ctg-scheduler
    optimizeFor: latency
  migration:
    enabled: false
  namespace: default
  tasks:
  - name: feeder
    image: mohammadalikh/gpt2-ctg:v1
    command:
    - python
    - feeder.py
    - --warmup
    - '45'
    - --auto
    - '2'
    dependencies: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/feeder/input
      subscribeTopics: []
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: l0-qkv
    image: mohammadalikh/gpt2-ctg:v1
    command:
    - python
    - layer_node_ctg.py
    args:
    - --role
    - qkv
    - --layer
    - '0'
    dependencies:
    - feeder
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/l0-qkv/output
      subscribeTopics:
      - gpt2-ctg/feeder/input
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: l0-attn-shard-0
    image: mohammadalikh/gpt2-ctg:v1
    command:
    - python
    - layer_node_ctg.py
    args:
    - --role
    - attn-shard
    - --layer
    - '0'
    - --shard-idx
    - '0'
    dependencies:
    - l0-qkv
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/l0-attn-shard-0/output
      subscribeTopics:
      - gpt2-ctg/l0-qkv/output
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: l0-attn-shard-1
