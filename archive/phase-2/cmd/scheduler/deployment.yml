apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctg-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctg-scheduler
  template:
    metadata:
      labels:
        app: ctg-scheduler
    spec:
      serviceAccountName: ctg-scheduler
      containers:
        - name: ctg-scheduler
          image: mohammadalikh/ctg-scheduler:latest
          args: []
          imagePullPolicy: Always
