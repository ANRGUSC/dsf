apiVersion: v1
kind: ServiceAccount
metadata:
  name: maxmin-controller
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maxmin-controller
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/binding", "nodes", "services"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["workflow.example.com"] 
    resources: ["dags"]                 
    verbs: ["get", "list", "watch"]     

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maxmin-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maxmin-controller
subjects:
  - kind: ServiceAccount
    name: maxmin-controller
    namespace: kube-system
