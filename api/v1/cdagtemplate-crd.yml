apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cdagtemplates.dsf.io
spec:
  group: dsf.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tasks]
              properties:
                description:
                  type: string
                  description: Human-readable description of this CDAG template.
                scheduler:
                  type: string
                  default: random
                  description: >
                    Scheduler to use for initial placement. Built-ins: random.
                restartPolicy:
                  type: string
                  default: Always
                  enum: [Always, OnFailure, Never]
                  description: Restart policy for task pods. Always means failed/evicted pods are recreated.
                retention:
                  type: object
                  description: Controls garbage collection of old CDAG instances.
                  properties:
                    maxInstances:
                      type: integer
                      default: 20
                      minimum: 1
                      description: Maximum number of terminated CDAG instances to keep. Oldest Failed instances are deleted first.
                tasks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      replicas:
                        type: integer
                        default: 1
                        minimum: 1
                      dataRate:
                        type: string
                        description: >
                          Expected output data rate for this task (e.g. "1MB/s", "500KB/s").
                          Used by the locality scheduler to minimize cross-node communication cost.
                      dependencies:
                        type: array
                        items:
                          type: string
                        default: []
                      resources:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      env:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      constraints:
                        type: object
                        properties:
                          nodeNames:
                            type: array
                            items:
                              type: string
                            description: If set, scheduler will only place this task on one of these nodes.
                      volumes:
                        type: array
                        description: >
                          Pod-level volumes for the task. Each item is a standard K8s
                          corev1.Volume. CDAG has no controller-owned volume names, so
                          all entries pass through unmodified.
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      volumeMounts:
                        type: array
                        description: >
                          Container-level volume mounts. Each item is a standard K8s
                          corev1.VolumeMount. Names must match a declared volume.
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      securityContext:
                        type: object
                        description: >
                          Pod-level securityContext (supplementalGroups, runAsUser,
                          fsGroup, etc.). Applied verbatim as corev1.PodSecurityContext.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                instanceCount:
                  type: integer
                  description: Total number of instances deployed from this template.
                lastInstanceName:
                  type: string
                  description: Name of the most recent CDAG instance.
                lastInstancePhase:
                  type: string
                  description: Phase of the most recent instance.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scheduler
          type: string
          jsonPath: .spec.scheduler
        - name: Tasks
          type: integer
          jsonPath: .spec.tasks
          description: Number of tasks (shown as array length by kubectl).
        - name: Instances
          type: integer
          jsonPath: .status.instanceCount
        - name: Last Phase
          type: string
          jsonPath: .status.lastInstancePhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: cdagtemplates
    singular: cdagtemplate
    kind: CDAGTemplate
    shortNames:
      - cdagt
