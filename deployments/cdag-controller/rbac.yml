apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdag-controller
  namespace: dsf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdag-controller
rules:
  # CDAG CRD
  - apiGroups: ["dsf.io"]
    resources: ["cdags"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dsf.io"]
    resources: ["cdags/status"]
    verbs: ["update", "patch"]
  # CDAGTemplate CRD
  - apiGroups: ["dsf.io"]
    resources: ["cdagtemplates"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["dsf.io"]
    resources: ["cdagtemplates/status"]
    verbs: ["update", "patch"]
  # Pods (create and manage task pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Services (create stable DNS endpoints for CDAG tasks)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Nodes (query cluster state for scheduler)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdag-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdag-controller
subjects:
  - kind: ServiceAccount
    name: cdag-controller
    namespace: dsf-system
