apiVersion: dsf.example.com/v1
kind: ContinuousTaskGraph
metadata:
  name: gpt2-ctg
  namespace: default
spec:
  zeromq:
    discovery:
      method: kubernetes
      namespace: default
      serviceNamePattern: '{task-name}-service'
    topicPrefix: gpt2-ctg
    defaultPort: 5555
    defaultTransport: tcp
    connectionTimeout: 5000
    reconnectInterval: 1000
    maxReconnectAttempts: 10
  scheduler:
    name: ctg-scheduler
    optimizeFor: latency
  migration:
    enabled: false
  namespace: default
  tasks:
  - name: feeder
    image: mohammadalikh/gpt2-single-layer-ctg:feeder-v4
    command:
    - tail
    - -f
    - /dev/null
    dependencies: []
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/feeder/input
      subscribeTopics: []
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: qkv
    image: mohammadalikh/gpt2-single-layer-ctg:qkv-v4
    command:
    - python
    - layer_node_ctg.py
    args:
    - --role
    - qkv
    dependencies:
    - feeder
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/qkv/output
      subscribeTopics:
      - gpt2-ctg/feeder/input
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: attn-shard-0
    image: mohammadalikh/gpt2-single-layer-ctg:attn-shard-v4
    command:
    - python
    - layer_node_ctg.py
    args:
    - --role
    - attn-shard
    - --shard-idx
    - '0'
    dependencies:
    - qkv
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
    replicas: 1
    zeromq:
      publishTopics:
      - gpt2-ctg/attn-shard-0/output
      subscribeTopics:
      - gpt2-ctg/qkv/output
      pattern: PUB
      port: 5555
      transport: tcp
      bind: true
  - name: attn-shard-1
    image: mohammadalikh/gpt2-single-layer-ctg:attn-shard-v4
    command:
    - python
    - layer_node_ctg.py
    args:
    - --role
    - attn-shard
    - --shard-idx
    - '1'
    dependencies:
    - qkv
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
