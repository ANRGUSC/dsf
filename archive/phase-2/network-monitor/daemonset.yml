---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-monitor
  namespace: kube-system
  labels:
    app: network-monitor
spec:
  selector:
    matchLabels:
      app: network-monitor
  template:
    metadata:
      labels:
        app: network-monitor
      annotations:
        container.apparmor.security.beta.kubernetes.io/network-monitor: unconfined
    spec:
      serviceAccountName: network-monitor
      hostNetwork: true
      hostPID: true
      containers:
      - name: network-monitor
        image: mohammadalikh/network-monitor:rtt
        imagePullPolicy: Always
        volumeMounts:
        # Mount /var/run for metrics output
        - name: metrics-volume
          mountPath: /var/run
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args:
        - "-i"
        - "1"  # Update interval in seconds
        - "-o"
        - "/var/run/network_metrics.prom"  # Metrics output file
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      # Metrics output directory
      - name: metrics-volume
        hostPath:
          path: /var/run
          type: Directory
      tolerations:
      # Run on all nodes including master
      - effect: NoSchedule
        operator: Exists
---
# Optional: Service to expose metrics
apiVersion: v1
kind: Service
metadata:
  name: network-monitor-metrics
  namespace: kube-system
  labels:
    app: network-monitor
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app: network-monitor
  ports:
  - name: metrics
    port: 9090
    protocol: TCP
