apiVersion: apps/v1
kind: Deployment
metadata:
  name: heft-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heft-controller
  template:
    metadata:
      labels:
        app: heft-controller
    spec:
      serviceAccountName: heft-controller
      containers:
        - name: heft-controller
          image: mohammadalikh/heft-controller:latest
          args:
            - "--kubeconfig="
          imagePullPolicy: Always
