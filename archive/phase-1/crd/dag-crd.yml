apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dags.workflow.example.com
spec:
  group: workflow.example.com
  scope: Namespaced
  names:
    plural: dags
    singular: dag
    kind: DAG
    listKind: DAGList
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              steps:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    image:
                      type: string
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string
                    dependencies:
                      type: array
                      items:
                        type: string
                    dataSize:
                      type: string
                      description: "Size of output data (e.g., 100MB, 1GB) - deprecated, use outputs instead"
                    outputs:
                      type: array
                      description: "Output artifacts produced by this step"
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: "Name of the output artifact (default: 'output')"
                          path:
                            type: string
                            description: "Path inside container where output is written"
                    inputs:
                      type: array
                      description: "Input artifacts required by this step (auto-populated from dependencies if not specified)"
                      items:
                        type: object
                        properties:
                          from:
                            type: string
                            description: "Name of the step that produces this input"
                          artifact:
                            type: string
                            description: "Name of the artifact from the source step (default: 'output')"
                          mountPath:
                            type: string
                            description: "Path where input will be mounted in container"
                    runtime:
                      type: integer
                      description: "Expected runtime in seconds"
                    cpu:
                      type: string
                      description: "CPU requirement (e.g., 500m, 1)"
                    memory:
                      type: string
                      description: "Memory requirement (e.g., 256Mi, 1Gi)"
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                        limits:
                          type: object
                    constraints:
                      type: object
                      properties:
                        nodeNames:
                          type: array
                          items:
                            type: string
                          description: "List of allowed node names for this step"
                    retryPolicy:
                      type: object
                      properties:
                        maxRetries:
                          type: integer
                        backoff:
                          type: string
                          enum: ["linear", "exponential"]
              schedulerName:
                type: string
                default: "random-controller"
              namespace:
                type: string
                default: "default"
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Running", "Succeeded", "Failed"]
              stepStatuses:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                    startTime:
                      type: string
                    completionTime:
                      type: string
                    retryCount:
                      type: integer
    subresources:
      status: {}