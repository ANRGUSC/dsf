apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pathload-receiver
spec:
  selector:
    matchLabels:
      app: pathload-receiver
  template:
    metadata:
      labels:
        app: pathload-receiver
    spec:
      hostNetwork: true
      containers:
      - name: pathload-d
        image: pathload-d:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/entrypoint.sh"]
        args: ["-r"]
        env:
        - name: IP
          value: "anrg-1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
