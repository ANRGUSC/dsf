apiVersion: apps/v1
kind: Deployment
metadata:
  name: heft-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heft-scheduler
  template:
    metadata:
      labels:
        app: heft-scheduler
    spec:
      serviceAccountName: heft-scheduler
      containers:
        - name: heft-scheduler
          image: mohammadalikh/heft-scheduler:latest
          args:
            - "--kubeconfig="
          imagePullPolicy: Always
