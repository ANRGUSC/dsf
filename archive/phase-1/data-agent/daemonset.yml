apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: data-agent
  namespace: kube-system
  labels:
    app: data-agent
spec:
  selector:
    matchLabels:
      app: data-agent
  template:
    metadata:
      labels:
        app: data-agent
    spec:
      # Use host network so pods can reach data-agent via node IP
      hostNetwork: true
      containers:
      - name: data-agent
        image: mohammadalikh/data-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          hostPort: 8080
          name: http
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args:
        - "-data-dir=/data/dag-outputs"
        - "-port=8080"
        volumeMounts:
        - name: dag-data
          mountPath: /data/dag-outputs
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: dag-data
        hostPath:
          path: /data/dag-outputs
          type: DirectoryOrCreate
      tolerations:
      # Run on all nodes including control plane
      - effect: NoSchedule
        operator: Exists
