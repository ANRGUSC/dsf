apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cdags.dsf.io
spec:
  group: dsf.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tasks]
              properties:
                scheduler:
                  type: string
                  default: random
                  description: >
                    Scheduler to use for initial placement. Built-ins: random.
                restartPolicy:
                  type: string
                  default: Always
                  enum: [Always, OnFailure, Never]
                  description: Restart policy for task pods. Always means failed/evicted pods are recreated.
                tasks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      replicas:
                        type: integer
                        default: 1
                        minimum: 1
                      dependencies:
                        type: array
                        items:
                          type: string
                        default: []
                      resources:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      env:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      constraints:
                        type: object
                        properties:
                          nodeNames:
                            type: array
                            items:
                              type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Degraded, Failed]
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      node:
                        type: string
                      desiredReplicas:
                        type: integer
                      readyReplicas:
                        type: integer
                      podNames:
                        type: array
                        items:
                          type: string
                startTime:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Scheduler
          type: string
          jsonPath: .spec.scheduler
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: cdags
    singular: cdag
    kind: CDAG
    shortNames:
      - cdag
