apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-server
  namespace: dsf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ui-server
rules:
  # ODAG and CDAG CRDs (read + retry)
  - apiGroups: ["dsf.io"]
    resources: ["odags", "cdags"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["dsf.io"]
    resources: ["odags/status", "cdags/status"]
    verbs: ["get"]
  # ODAGTemplate CRDs (read + create runs)
  - apiGroups: ["dsf.io"]
    resources: ["odagtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dsf.io"]
    resources: ["odagtemplates/status"]
    verbs: ["get"]
  # CDAGTemplate CRDs (read + deploy instances)
  - apiGroups: ["dsf.io"]
    resources: ["cdagtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dsf.io"]
    resources: ["cdagtemplates/status"]
    verbs: ["get"]
  # Pods (read-only, for log links and task node info)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Events (read-only)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ui-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ui-server
subjects:
  - kind: ServiceAccount
    name: ui-server
    namespace: dsf-system
