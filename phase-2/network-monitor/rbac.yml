---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-monitor
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-monitor
rules:
  # Read node information
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Read pod information (to map connections to pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-monitor
subjects:
  - kind: ServiceAccount
    name: network-monitor
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: network-monitor
  apiGroup: rbac.authorization.k8s.io
