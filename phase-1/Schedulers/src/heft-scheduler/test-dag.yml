apiVersion: workflow.example.com/v1
kind: DAG
metadata:
  name: sample-workflow
spec:
  steps:
    - name: step1
      image: busybox
      command: ["sh", "-c"]
      args: ["echo 'Step 1 completed'; sleep 10; exit 0"]
      dependencies: []
      dataSize: "250MB"
      runtime: 10
      cpu: "500m"
      memory: "256Mi"
      retryPolicy:
        maxRetries: 2
        backoff: "exponential"
    - name: step2
      image: busybox
      command: ["sh", "-c"]
      args: ["echo 'Step 2 completed'; sleep 10; exit 0"]
      dependencies: ["step1"]
      dataSize: "375MB"
      runtime: 10
      cpu: "1000m"
      memory: "512Mi"
      retryPolicy:
        maxRetries: 3
        backoff: "linear"
    - name: step3
      image: busybox
      command: ["sh", "-c"]
      args: ["echo 'Step 3 completed'; sleep 10; exit 0"]
      dependencies: ["step1"]
      dataSize: "300MB"
      runtime: 10
      cpu: "750m"
      memory: "384Mi"
      retryPolicy:
        maxRetries: 1
        backoff: "exponential"
    - name: step4
      image: busybox
      command: ["sh", "-c"]
      args: ["echo 'Step 4 completed'; sleep 10"]
      dependencies: ["step2", "step3"]
      dataSize: "500MB"
      runtime: 10
      cpu: "1500m"
      memory: "768Mi"
      retryPolicy:
        maxRetries: 2
        backoff: "exponential"
  schedulerName: heft-scheduler
  namespace: default